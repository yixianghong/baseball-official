<!--
  分頁圖示。

  刻意不用隊徽原圖：「MERCS」是橫式字標，縮到 16px 完全認不出來。
  這裡改用隊名縮寫的單色標記，配色取自球衣（墨藍底 + 金色描邊），
  跟 icon-192/512 的深色底是同一個視覺家族。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="HG MERCENARIES">
  <rect width="32" height="32" rx="7" fill="#071221" />
  <rect x="2.25" y="2.25" width="27.5" height="27.5" rx="5.25" fill="none" stroke="#ddb63b" stroke-width="1.5" />
  <text
    x="16"
    y="16.5"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="14"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#ffffff"
  >HG</text>
</svg>

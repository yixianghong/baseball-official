# Firebase App Hosting 的執行設定。
#
# App Hosting 會自動偵測這是 Nuxt 專案：安裝相依套件、執行 `pnpm build`，
# 然後用 `pnpm start` 啟動 `.output/server/index.mjs`。底層是 Cloud Run，
# 所以 PORT 由平台注入，Nitro 會自己讀。
#
# ## 機密怎麼放
# 標成 `secret:` 的項目存在 Cloud Secret Manager，不會出現在這個檔案、
# 也不會進版本控制。建立方式：
#
#   firebase apphosting:secrets:set nuxt-session-password
#   firebase apphosting:secrets:set firebase-web-api-key
#   firebase apphosting:secrets:set gemini-api-key
#
# ⚠️ CLI 問「要不要把它加進 apphosting.yaml」時請選 **No**。
#
# 它會從機密的名稱推導出環境變數名（gemini-api-key → GEMINI_API_KEY），
# 但 Nuxt 只認得 `NUXT_` 開頭的名稱（runtimeConfig 的對應規則），自動加的那個
# 讀不到；而 firebase-web-api-key 推導出的 FIREBASE_WEB_API_KEY 還會撞上
# App Hosting 保留的前綴（X_GOOGLE_ / FIREBASE_ / EXT_）而直接報錯。
#
# 這個檔案裡的對應都是手動寫好的，變數名一律 NUXT_ 開頭，不會有這些問題。
#
# 建立後要授權 App Hosting 的服務帳戶讀取（CLI 會問，選 yes 即可）：
#
#   firebase apphosting:secrets:grantaccess nuxt-session-password --backend <後端名稱>
#
# ## 為什麼沒有 service account 的私鑰
# 這裡跑在 Google Cloud 上，Admin SDK 直接用執行環境本身的身分（ADC）存取
# Firestore 與 Storage —— 不需要把私鑰放進雲端的任何地方。
# 少一份要保管的機密，就少一個外洩的途徑。見 `server/utils/firebase.ts`。

runConfig:
  # 球隊官網的流量很小，讓它在沒人看的時候縮到零，只有冷啟動的延遲成本
  minInstances: 0
  maxInstances: 2
  # 單一實例可同時處理的請求數。SSR 是 I/O 為主，80 很寬裕
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # ── 公開設定（會進前端 bundle，只能放非機密）──────────────────────
  - variable: NUXT_PUBLIC_SITE_URL
    value: https://baseball-official--hg-baseball.asia-east1.hosted.app
    availability:
      - BUILD
      - RUNTIME

  # ── Firebase ────────────────────────────────────────────────────
  # 只需要專案 ID：憑證用執行環境的身分（ADC）
  - variable: NUXT_FIREBASE_PROJECT_ID
    value: hg-baseball
    availability:
      - RUNTIME

  - variable: NUXT_FIREBASE_STORAGE_BUCKET
    value: hg-baseball.firebasestorage.app
    availability:
      - RUNTIME

  # Web API 金鑰：後台登入時由伺服器端呼叫 Identity Toolkit 驗證帳密。
  # 它本身不算高度機密（前端 SDK 也會帶它），但沒有理由讓它出現在原始碼裡。
  #
  # 保留前綴限制的是**環境變數的名稱**，不是機密的名稱 —— 這裡的變數叫
  # NUXT_FIREBASE_WEB_API_KEY（NUXT_ 開頭，安全），所以機密仍可沿用
  # firebase-web-api-key 這個名字。
  - variable: NUXT_FIREBASE_WEB_API_KEY
    secret: firebase-web-api-key
    availability:
      - RUNTIME

  # ── Session ─────────────────────────────────────────────────────
  # 加密 session cookie 的密鑰。換掉它等於讓所有人登出。
  - variable: NUXT_SESSION_PASSWORD
    secret: nuxt-session-password
    availability:
      - RUNTIME

  # ── Gemini 圖片辨識 ─────────────────────────────────────────────
  - variable: NUXT_GEMINI_API_KEY
    secret: gemini-api-key
    availability:
      - RUNTIME

  # ── 推播（Web Push / VAPID）─────────────────────────────────────
  #
  # 金鑰由 `npx web-push generate-vapid-keys` 產生，正式環境與本機各一組。
  # 私鑰存在 Secret Manager 的 vapid-private-key，這裡只放公鑰。
  #
  # ⚠️ 換掉私鑰等於讓所有既有訂閱失效，每個人都要重新開啟一次通知。
  # 公鑰換了也一樣：瀏覽器不允許同一個 registration 存在兩把不同金鑰的訂閱，
  # 前端會先退掉舊的再訂新的（見 `app/composables/usePushSubscription.ts`）。
  #
  # 三項缺任何一項，推播會整個關閉（前台訂閱按鈕與後台推播頁都不出現），
  # 網站其餘功能不受影響。

  # 公鑰要進前端 bundle，所以 BUILD 階段就得拿得到。
  # 它本來就該公開 —— 瀏覽器訂閱推播時必須帶上它。
  - variable: NUXT_PUBLIC_VAPID_PUBLIC_KEY
    value: 'BKVNEayHqyJTwD15O6_1-FgoXPH8SlrS0s_JprelV8PxB8XyqOqNEM__09-Pmpy6oZXzNUw24kYXAl-nwSHOkSU'
    availability:
      - BUILD
      - RUNTIME

  # 推送服務（Google / Mozilla / Apple）遇到問題時會用這個聯絡我們
  - variable: NUXT_VAPID_SUBJECT
    value: 'mailto:a10010134@gmail.com'
    availability:
      - RUNTIME

  - variable: NUXT_VAPID_PRIVATE_KEY
    secret: vapid-private-key
    availability:
      - RUNTIME

  # ── 中央氣象署（比賽當天的天氣預報）─────────────────────────────
  #
  # 授權碼申請：https://opendata.cwa.gov.tw/user/authkey
  # 機密建立與授權（兩行都寫成單行 —— 續行的反斜線後面只要多一個空白，
  # zsh 會把它當成「轉義的空白」而不是換行，後面的旗標整串被當成一個參數，
  # 而且**不會報錯**，看起來像成功了，實際上什麼都沒發生）：
  #
  #   echo -n "<授權碼>" | firebase apphosting:secrets:set cwa-api-key --project hg-baseball --data-file -
  #   firebase apphosting:secrets:grantaccess cwa-api-key --project hg-baseball --backend baseball-official --location asia-east1
  #
  # ⚠️ CLI 問「要不要加進 apphosting.yaml」時一樣選 No（理由見上面的說明）。
  #
  # 授權到底有沒有生效要另外驗，不能只看指令沒報錯：
  #
  #   gcloud secrets get-iam-policy cwa-api-key --project hg-baseball
  #
  # 正常會看到 firebase-app-hosting-compute@ 的 secretAccessor。空的（只有
  # etag）就是沒授權，而症狀要等到部署才會出現。
  #
  # 沒設定時天氣功能會自動關閉，不影響網站其他功能。
  - variable: NUXT_CWA_API_KEY
    secret: cwa-api-key
    availability:
      - RUNTIME

  # ── 執行環境 ────────────────────────────────────────────────────
  - variable: LOG_LEVEL
    value: info
    availability:
      - RUNTIME

  - variable: SERVICE_NAME
    value: baseball-official
    availability:
      - RUNTIME

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一個 PR 有新 commit 時，取消還在跑的舊流程，省 CI 額度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 測試用的假值。真實密鑰請放 GitHub Secrets，絕不寫在這裡。
  NUXT_SESSION_PASSWORD: ci-only-session-password-with-enough-length

jobs:
  # 靜態檢查與快速測試放一起，幾十秒內就能給出回饋
  quality:
    name: 檢查與單元測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安裝相依套件
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: 格式檢查
        run: pnpm format:check

      - name: 型別檢查
        run: pnpm typecheck

      - name: 單元測試
        run: pnpm test:unit

      - name: 元件與 composable 測試
        run: pnpm test:nuxt

  # e2e 需要完整建置，較慢，獨立成一個 job 才能與上面平行執行
  e2e:
    name: 端對端測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安裝相依套件
        run: pnpm install --frozen-lockfile

      - name: 端對端測試
        run: pnpm test:e2e

  build:
    name: 建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安裝相依套件
        run: pnpm install --frozen-lockfile

      - name: 建置
        run: pnpm build

      # 這一步驗證的是「建置產物真的跑得起來」—— 測試是在原始碼上跑的，
      # 建置設定壞掉（例如相依沒被正確標為 external）測試一樣會全過。
      - name: 缺少必要設定時必須拒絕啟動
        run: |
          # production 少了 Firebase 設定卻照常啟動，等於整個網站悄悄跑在
          # 記憶體示範資料上。這裡確認它會明確地失敗，而不是默默降級。
          if node .output/server/index.mjs > startup.log 2>&1; then
            echo "::error::缺少 Firebase 設定時仍然啟動成功，設定驗證失效了"
            cat startup.log
            exit 1
          fi
          grep -q "設定驗證失敗" startup.log
          echo "✓ 設定不完整時如預期拒絕啟動"

      - name: 驗證產物能實際啟動並服務請求
        run: |
          # ALLOW_MEMORY_STORE 讓它跑在記憶體資料上，CI 不需要也不該連正式資料庫
          ALLOW_MEMORY_STORE=true node .output/server/index.mjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done

          # 健康檢查要通
          curl -sf http://localhost:3000/api/health | grep -q '"success":true'

          # 前台每一頁都要能渲染
          for path in / /schedule /results /players /news; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            test "$code" = "200" || { echo "::error::$path 回應 $code"; exit 1; }
          done

          # 後台未登入必須被導向登入頁，而不是直接進得去
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin)
          test "$code" = "302" || { echo "::error::/admin 未登入時回應 $code，應為 302"; exit 1; }

          # 寫入端點未登入必須回 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{}' \
            http://localhost:3000/api/admin/players)
          test "$code" = "401" || { echo "::error::未登入的寫入端點回應 $code，應為 401"; exit 1; }

          kill $SERVER_PID
        env:
          ALLOW_MEMORY_STORE: 'true'

  docker:
    name: Docker 映像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: 建置映像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
